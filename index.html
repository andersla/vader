  <meta name="color-scheme" content="light dark">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #000000;
      --link: #0000ee;
      --link-visited: #551a8b;
      --cold: #0070ff;
      --rain: #0070ff;
      --pop: #0040cc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --fg: #e6e6e6;
        --link: #8ab4f8;
        --link-visited: #c58af9;
        --cold: #5aa9ff;
        --rain: #5aa9ff;
        --pop: #7fb8ff;
      }

      /* Black wind arrow -> white */
      img.wind {
        filter: invert(1);
      }
    }

    body {
      background: var(--bg);
      color: var(--fg);
      margin-top: 5px;
      margin-left: 20px;
      margin-right: 10px;
    }

    a:link {
      text-decoration: none;
      color: var(--link);
    }

    a:visited {
      color: var(--link-visited);
    }

    td {
      padding: 2px;
    }
  </style>

</head>
